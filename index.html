<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes de Rhumatologie</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.2.0/github-markdown.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-light.min.css" id="hljs-light">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css" id="hljs-dark" disabled>
    <link rel="stylesheet" href="assets/style.css">
    <script>
        // Appliquer le thème sauvegardé avant le rendu pour éviter un flash
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('rhumato-theme'); } catch (e) {}
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
        })();
    </script>
</head>
<body>
    <div class="container">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h1>📚 Rhumatologie</h1>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Chercher...">
                </div>
            </div>
            <div class="nav-content" id="navContent">
                <div class="loading">Chargement...</div>
            </div>
        </nav>
        
        <main class="main-content">
            <div class="content-header">
                <button id="toggleNav" class="toggle-nav">☰</button>
                <div class="header-actions">
                    <button id="backBtn" class="header-btn" title="Retour à la page précédente (ou au sommaire)" aria-label="Retour">←</button>
                    <button id="themeBtn" class="header-btn" title="Mode sombre" aria-label="Basculer le thème">🌙</button>
                </div>
            </div>
            <article id="content" class="markdown-body">
                <div class="loading">Bienvenue ! Chargement du contenu...</div>
            </article>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script src="assets/app.js"></script>
</body>
</html>
